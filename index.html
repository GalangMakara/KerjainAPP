<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KerjainApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tenggat.css">
</head>
<body>

<!-- SVG icon sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus"     viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check"    viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-edit"     viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash"    viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M5 6h14v13H5zM5 10h14M9 4v4M15 4v4"/></symbol>
    <symbol id="i-clock"    viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-bell"     viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0112 0v6l1.5 1.5h-15zM10 21h4"/></symbol>
    <symbol id="i-search"   viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
    <symbol id="i-filter"   viewBox="0 0 24 24"><path d="M4 6h16l-6 7v5l-4 2v-7z"/></symbol>
    <symbol id="i-alert"    viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></symbol>
    <symbol id="i-x"        viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-undo"     viewBox="0 0 24 24"><path d="M8 5L4 9l4 4M4 9h11a5 5 0 010 10H9"/></symbol>
    <symbol id="i-summary"  viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v4h-7zM13 12h7v7h-7zM4 15h7v4H4z"/></symbol>
    <symbol id="i-list"     viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-tag"      viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 8h.01"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
    <symbol id="i-sort"     viewBox="0 0 24 24"><path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3"/></symbol>
    <symbol id="i-sun"      viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-moon"     viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
  </defs>
</svg>

<a class="skip" href="#utama">Lewati ke konten utama</a>

<div class="app">

  <!-- Sidebar -->
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <b>KerjainApp</b>
      <button class="ib collapse" id="collapse" aria-label="Ciutkan sidebar" title="Ciutkan sidebar">
        <svg class="i"><use href="#i-collapse"/></svg>
      </button>
    </div>
    <button class="btn pri" data-act="new" title="Tugas baru (N)" aria-label="Tugas baru">
      <svg class="i"><use href="#i-plus"/></svg>
      <span class="lbl">Tugas baru</span>
    </button>
    <nav class="nav" aria-label="Navigasi utama" id="nav"></nav>
    <div class="cats" id="cats"></div>
    <div class="side-foot">
      <button class="ib" id="theme" aria-label="Ganti tema" title="Ganti tema">
        <svg class="i"><use href="#i-moon"/></svg>
      </button>
      <button class="btn lbl" data-act="help" style="flex:1">Pintasan</button>
    </div>
  </aside>

  <!-- Main shell -->
  <div class="shell">
    <main id="utama" tabindex="-1">
      <div class="banners" id="banners" aria-live="polite"></div>
      <header class="hero rise" id="hero" style="--i:0"></header>
      <section class="sum rise" id="sum" style="--i:1" aria-label="Ringkasan"></section>
      <section class="rise" id="focus" style="--i:2" aria-labelledby="fh"></section>
      <section class="rise" style="--i:3" aria-labelledby="lh">
        <div class="sec-h"><h2 id="lh">Semua tugas</h2></div>
        <div class="tools">
          <label class="fld grow">
            <svg class="i"><use href="#i-search"/></svg>
            <span class="sr">Cari tugas</span>
            <input id="q" type="search" placeholder="Cari, misalnya listrik">
          </label>
          <label class="fld">
            <svg class="i"><use href="#i-filter"/></svg>
            <span class="sr">Filter kategori</span>
            <select id="fcat"></select>
          </label>
          <label class="fld">
            <svg class="i"><use href="#i-sort"/></svg>
            <span class="sr">Urutkan</span>
            <select id="sort">
              <option value="tenggat">Tenggat</option>
              <option value="judul">Judul</option>
              <option value="terbaru">Terbaru</option>
            </select>
          </label>
          <div class="seg" role="group" aria-label="Tampilan daftar">
            <button data-lay="tabel"  aria-pressed="true"><svg class="i s"><use href="#i-list"/></svg>Tabel</button>
            <button data-lay="kartu"  aria-pressed="false"><svg class="i s"><use href="#i-summary"/></svg>Kartu</button>
            <button data-lay="minggu" aria-pressed="false"><svg class="i s"><use href="#i-calendar"/></svg>Minggu</button>
          </div>
        </div>
        <div id="list"></div>
      </section>
    </main>

    <!-- Right aside: mini calendar & reminders -->
    <aside class="aside" aria-label="Panel kanan">
      <h2 id="mh"></h2>
      <div class="cal" id="cal"></div>
      <h2>Pengingat terdekat</h2>
      <ul class="up" id="up"></ul>
    </aside>
  </div><!-- /.shell -->

</div><!-- /.app -->

<!-- Mobile bottom nav & FAB -->
<nav class="bnav" aria-label="Navigasi bawah" id="bnav"></nav>
<button class="fab" data-act="new" aria-label="Tugas baru" title="Tugas baru">
  <svg class="i"><use href="#i-plus"/></svg>
</button>

<!-- Toast / undo -->
<div class="toast" id="toast" role="status" hidden>
  <span id="toast-t"></span>
  <button class="btn" id="undo"><svg class="i s"><use href="#i-undo"/></svg>Batalkan</button>
</div>

<!-- Dialog: new / edit task -->
<dialog id="dlg" aria-labelledby="dt">
  <form id="f" novalidate>
    <div class="dh">
      <h2 id="dt">Tugas baru</h2>
      <button type="button" class="ib" data-act="close" aria-label="Tutup" title="Tutup (Esc)">
        <svg class="i"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="f">
      <label for="ti">Judul tugas</label>
      <input id="ti" type="text" required autocomplete="off" placeholder="Bayar listrik sebelum tanggal 20">
    </div>
    <fieldset class="f">
      <legend>Tenggat</legend>
      <div class="chips" id="chips">
        <label><input type="radio" name="dd" value="hari"  checked>Hari ini</label>
        <label><input type="radio" name="dd" value="besok">Besok</label>
        <label><input type="radio" name="dd" value="akhir">Akhir pekan</label>
        <label><input type="radio" name="dd" value="pilih">Pilih tanggal</label>
        <label><input type="radio" name="dd" value="none">Tanpa tenggat</label>
      </div>
    </fieldset>
    <div class="f" id="dwrap" hidden>
      <label for="dv">Tanggal</label>
      <input id="dv" type="date">
    </div>
    <div class="f">
      <label for="tm">Jam (opsional)</label>
      <input id="tm" type="time">
    </div>
    <div id="more" hidden>
      <div class="f">
        <label for="ct">Kategori</label>
        <input id="ct" type="text" list="cl" autocomplete="off" placeholder="Rumah">
        <datalist id="cl"></datalist>
      </div>
      <div class="f">
        <label for="nt">Catatan</label>
        <textarea id="nt" rows="3" placeholder="Nomor pelanggan ada di tagihan bulan lalu"></textarea>
      </div>
    </div>
    <div class="row2">
      <button type="button" class="btn" id="tmore">
        <svg class="i"><use href="#i-tag"/></svg>Tambah kategori dan catatan
      </button>
      <button class="btn pri" type="submit">
        <svg class="i"><use href="#i-check"/></svg>Simpan tugas
      </button>
    </div>
  </form>
</dialog>

<!-- Dialog: keyboard shortcuts -->
<dialog id="help" aria-labelledby="ht">
  <div class="dh">
    <h2 id="ht">Pintasan keyboard</h2>
    <button class="ib" data-act="close" aria-label="Tutup" title="Tutup (Esc)">
      <svg class="i"><use href="#i-x"/></svg>
    </button>
  </div>
  <dl class="keys">
    <dt><kbd>N</kbd></dt>     <dd>Tugas baru</dd>
    <dt><kbd>/</kbd></dt>     <dd>Cari tugas</dd>
    <dt><kbd>Enter</kbd></dt> <dd>Simpan tugas</dd>
    <dt><kbd>Esc</kbd></dt>   <dd>Tutup panel</dd>
    <dt><kbd>?</kbd></dt>     <dd>Daftar pintasan</dd>
  </dl>
</dialog>

<script src="js/tenggat.js"></script>
</body>
</html>
